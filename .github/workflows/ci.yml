name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify native glass SDK
        run: scripts/check-glass-sdk.sh
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build release app
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: scripts/build-app.sh
      - name: Verify packaged application
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          build=$(plutil -extract CFBundleVersion raw Info.plist)
          ditto -c -k --sequesterRsrc --keepParent "build/Traffic Lights Glass.app" build/ci.zip
          scripts/validate-release-asset.sh build/ci.zip "$TARGET_ARCH" "$version" "$build"
  sanitizers:
    name: ${{ matrix.sanitizer }} Sanitizer
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: swift test --sanitize=${{ matrix.sanitizer }}
