name: Validate Release Assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - name: Download and validate signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          version=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          build=$(plutil -extract CFBundleVersion raw Info.plist)
          [[ "$RELEASE_TAG" == "v$version" ]]
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          (cd assets; shasum -a 256 -c SHA256SUMS.txt)
          for arch in arm64 x86_64; do
            name="Traffic-Lights-Glass-$version-$arch"
            scripts/validate-appcast.sh "assets/appcast-$arch.xml" "assets/$name.zip" "$arch" "$version" "$build" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name.zip"
            scripts/validate-release-asset.sh "assets/$name.zip" "$arch" "$version" "$build"
          done
